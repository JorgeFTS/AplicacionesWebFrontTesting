# Sirve el frontend con nginx en http://localhost:4173
# Uso:  docker compose up --build
# Para apuntar a otro backend:  VITE_API_BASE_URL=https://mi-api/ docker compose up --build
services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/}
    ports:
      - "4173:8080"
